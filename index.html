<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lantern</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="toolbar">
      <input id="address" type="text" placeholder="Enter URL or search (e.g. github.com)" />
      <button id="go">Go</button>
      <button id="open-github">Open GitHub</button>
      <button id="install-app">Install App</button>
    </div>
    <div id="webview-container">
      <iframe id="webview" sandbox="allow-scripts allow-forms allow-same-origin" src="https://example.com"></iframe>
    </div>

    <script type="module" src="src/renderer.js"></script>
  </body>
</html>
